kind = "web"
previewPath = "/"
title = "Offshore Wind Farm Tracker"
version = "1.0.0"
id = "artifacts/wind-farm-tracker"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20841

[services.development]
run = "pnpm --filter @workspace/wind-farm-tracker run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/wind-farm-tracker", "run", "build" ]
publicDir = "artifacts/wind-farm-tracker/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20841"
BASE_PATH = "/"
