openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Offshore Wind Farm Tracker API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: projects
    description: Wind farm projects
  - name: users
    description: User management
  - name: companies
    description: Company management
  - name: notifications
    description: Notification operations
  - name: dashboard
    description: Dashboard stats

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out

  /notifications:
    get:
      operationId: getNotifications
      tags: [notifications]
      summary: Get notification counts
      responses:
        "200":
          description: Notification data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notifications"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard statistics
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all projects
      parameters:
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Projects list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{id}:
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive]
        - name: company
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Users list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /users/{id}/change-password:
    post:
      operationId: changeUserPassword
      tags: [users]
      summary: Change user password
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Password changed

  /companies:
    get:
      operationId: listCompanies
      tags: [companies]
      summary: List companies
      responses:
        "200":
          description: Companies list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Company"
    post:
      operationId: createCompany
      tags: [companies]
      summary: Create company
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"

  /companies/{id}:
    patch:
      operationId: updateCompany
      tags: [companies]
      summary: Update company
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
    delete:
      operationId: deleteCompany
      tags: [companies]
      summary: Delete company
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AuthUser:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        isAdmin:
          type: boolean
        companyId:
          type: ["integer", "null"]
      required: [id, email, isAdmin]

    LoginInput:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required: [email, password]

    Notifications:
      type: object
      properties:
        inactive_users:
          type: integer
      required: [inactive_users]

    DashboardStats:
      type: object
      properties:
        totalUsers:
          type: integer
        totalCompanies:
          type: integer
        totalProjects:
          type: integer
      required: [totalUsers, totalCompanies, totalProjects]

    Project:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        published:
          type: boolean
        active:
          type: boolean
        sheetUrl:
          type: ["string", "null"]
        mapCenter:
          type: ["string", "null"]
        mapZoom:
          type: ["number", "null"]
        createdAt:
          type: string
      required: [id, name, slug, published, active]

    ProjectInput:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        published:
          type: boolean
        active:
          type: boolean
        sheetUrl:
          type: string
        mapCenter:
          type: string
        mapZoom:
          type: number
      required: [name, slug]

    ProjectUpdate:
      type: object
      properties:
        name:
          type: string
        published:
          type: boolean
        active:
          type: boolean
        sheetUrl:
          type: string
        mapCenter:
          type: string
        mapZoom:
          type: number

    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        isActive:
          type: boolean
        isAdmin:
          type: boolean
        dateJoined:
          type: string
        companyId:
          type: ["integer", "null"]
        companyName:
          type: ["string", "null"]
        projectIds:
          type: array
          items:
            type: integer
      required: [id, email, isActive, isAdmin]

    UserInput:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
        isAdmin:
          type: boolean
        companyId:
          type: integer
        projectIds:
          type: array
          items:
            type: integer
      required: [email, password]

    UserUpdate:
      type: object
      properties:
        isActive:
          type: boolean
        isAdmin:
          type: boolean
        companyId:
          type: ["integer", "null"]
        projectIds:
          type: array
          items:
            type: integer

    ChangePasswordInput:
      type: object
      properties:
        password:
          type: string
      required: [password]

    Company:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        employeeCount:
          type: integer
        projectCount:
          type: integer
        inviteToken:
          type: ["string", "null"]
      required: [id, name, employeeCount, projectCount]

    CompanyInput:
      type: object
      properties:
        name:
          type: string
      required: [name]

    CompanyUpdate:
      type: object
      properties:
        name:
          type: string
